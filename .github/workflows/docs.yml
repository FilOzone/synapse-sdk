# Builds and checks the docs. Same-repo pull requests upload the built site,
# which docs-preview.yml deploys as a Worker Preview. Releases (called from
# release-please.yml) and manual runs from master deploy production.
name: documentation
on:
  pull_request:
    paths:
      - docs/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/.markdownlint-cli2.jsonc
      - .github/workflows/docs.yml
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event.pull_request.number || 'production' }}
  # Newer pushes replace PR runs; production deploys run one after another
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - run: pnpm run check:markdown
      - run: pnpm run build
      - run: pnpm -r --filter docs run build
        env:
          CHECK_LINKS: 1
      # Same-repo PRs hand the built site to docs-preview.yml, which deploys it
      # without running any PR code. Fork and Dependabot PRs get no preview.
      - name: Upload site for preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 1
      - name: Deploy production docs
        if: github.event_name != 'pull_request' && github.ref_name == 'master'
        run: pnpm --dir docs exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload Wrangler logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/*.log
          if-no-files-found: ignore
