name: Pkg PR New
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
      - name: Build
        run: pnpm build
      - run: pnpm exec pkg-pr-new publish --pnpm './packages/*'
