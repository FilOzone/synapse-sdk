packages:
  - packages/*
  - examples/*
  - apps/*
  - docs
  - utils

allowBuilds:
  esbuild: true
  keccak: false
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

catalog:
  '@biomejs/biome': 2.6.7
  '@types/mocha': ^10.0.10
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  abitype: 1.3.0
  mocha: ^11.7.4
  msw: 2.15.0
  ox: 0.14.67
  typescript: 6.0.3
  viem: 2.58.0
  wagmi: 3.7.11
  zod: ^4.6.7
  iso-web: ^4.0.0

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # first-party (hugomrdias): published and consumed by us immediately
  - iso-ledger
  - iso-web
  - iso-kv
  - iso-base
  - '@hugomrdias/docs'
  - '@hugomrdias/commp-wasm'
  - playwright-test
  # viem 2.58.0 fixes shared receipt polling after a timeout (#1114) and adds `signal`.
  # Remove once both are past the release age (2026-11-24).
  - viem@2.58.0
  - ox@0.14.67

trustPolicy: no-downgrade

trustPolicyExclude:
  # 0.2.0 published manually without provenance (0.1.9 was trusted-published).
  # Remove when republished via trusted CI.
  - '@hugomrdias/docs@0.2.0'
  # Last 4.x (Dec 2024) predates chokidar adopting trusted publishing at 5.0.0.
  # Permanent while anything depends on chokidar@^4.
  - chokidar@4.0.3
